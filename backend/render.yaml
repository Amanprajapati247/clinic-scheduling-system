services:
  - type: web
    name: clinic-scheduling-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:switch:postgres && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Set in Render dashboard (Supabase PostgreSQL Connection URI)
      - key: JWT_SECRET
        generateValue: true # Generates secure random key automatically
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL e.g. https://your-clinic.vercel.app
